name: Check CDN Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC (disabled on forks)
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - 'feature/*'  # Requires a feature branch
#    paths:
#      - 'templates/layout.html'
#      - '.github/workflows/check-cdn-updates.yml'
#      - 'scripts/check_cdn_updates.py'

permissions:
  contents: read
  # issues: write  # Disabled on forks for security - see summary output instead

jobs:
  check-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Check for CDN updates
        id: check
        continue-on-error: true
        run: |
          python3 scripts/check_cdn_updates.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # Exit codes: 0=up to date, 1=safe updates (create issue), 2=incompatible only (no issue)
          exit $EXIT_CODE

#       Issue creation disabled on forks (requires issues: write permission)
#       On forks, check the workflow summary for the full report
      - name: Create or update issue
        if: steps.check.outputs.exit_code == '1' #&& github.repository == 'fedora-eln/content-resolver'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Read the report generated by the Python script
            let report;
            try {
              report = fs.readFileSync('cdn-update-report.md', 'utf8');
            } catch (error) {
              console.log('No report file found');
              return;
            }

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies,cdn'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('CDN Dependency Updates')
            );

            const timestamp = new Date().toISOString().split('T')[0];

            if (existingIssue) {
              // Update existing issue with new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 Update Check - ${timestamp}\n\n${report}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 CDN Dependency Updates Available',
                body: report,
                labels: ['dependencies', 'cdn', 'enhancement']
              });
              console.log('Created new issue for CDN updates');
            }

      - name: Summary
        if: always()
        run: |
          echo "## CDN Update Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f cdn-update-report.md ]; then
            cat cdn-update-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Add note about issue creation
            if [ "${{ steps.check.outputs.exit_code }}" = "1" ]; then
              echo "✅ **Issue created/updated** - safe updates are available" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.check.outputs.exit_code }}" = "2" ]; then
              echo "ℹ️  **No issue created** - only incompatible updates found" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ All CDN dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          fi
